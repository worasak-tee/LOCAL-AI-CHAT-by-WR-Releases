name: Publish V1.2.0

on:
  push:
    paths:
      - ".github/workflows/publish-v1.2.0.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: v1.2.0
      BUNDLE_URL: 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-ad34-8211-bc31-84ab62d5cab7/raw?se=2026-08-19T11%3A30%3A05Z&sp=r&sv=2026-02-06&sr=b&scid=2f1445b5-5f29-5c71-ab8c-78f96ff24abb&skoid=6fa9748a-b7b2-4b56-a932-8c1417549c47&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-19T04%3A24%3A07Z&ske=2026-08-20T04%3A24%3A07Z&sks=b&skv=2026-02-06&sig=jBxV9re3yDALl0x2bU85IFEsv7PBQA0OmesBiRR7J5o%3D'
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4

      - name: Download validated public release artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$BUNDLE_URL" -o bundle.zip
          mkdir -p stage
          unzip -q bundle.zip -d stage
          ls -lh stage

      - name: Validate binary-only bundle
        shell: bash
        run: |
          set -euo pipefail
          cd stage
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          expected = {
              'LOCAL-AI-CHAT-by-WR_Portable.exe',
              'LOCAL-AI-CHAT-by-WR_Update_V1.2.0.zip',
              'SHA256SUMS.txt',
          }
          actual = {p.name for p in Path('.').iterdir() if p.is_file()}
          if actual != expected:
              raise SystemExit(f'Unexpected public release files: {sorted(actual)}')

          update_zip = Path('LOCAL-AI-CHAT-by-WR_Update_V1.2.0.zip')
          with zipfile.ZipFile(update_zip) as zf:
              names = set(zf.namelist())
          expected_update = {
              'patch_manifest.json',
              'payload/LOCAL-AI-CHAT-by-WR_Portable.exe',
          }
          if names != expected_update:
              raise SystemExit(f'Unexpected Update ZIP contents: {sorted(names)}')

          forbidden = {'.py', '.pyw', '.bat', '.ps1', '.toml', '.yml', '.yaml'}
          if any(Path(name).suffix.lower() in forbidden for name in names):
              raise SystemExit('Source-like file detected in public Update ZIP')
          print('Binary-only validation: PASS')
          PY
          sha256sum -c SHA256SUMS.txt

      - name: Publish stable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "$TAG" \
            stage/LOCAL-AI-CHAT-by-WR_Portable.exe \
            stage/LOCAL-AI-CHAT-by-WR_Update_V1.2.0.zip \
            stage/SHA256SUMS.txt \
            --target main \
            --title "LOCAL-AI-CHAT-by-WR v1.2.0" \
            --notes "Stable Production release V1.2.0.\n\nAssets are binary-only. Application source code remains in the private development repository.\n\nAuto Update feed: worasak-tee/LOCAL-AI-CHAT-by-WR-Releases"

      - name: Verify published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json tagName,isDraft,isPrerelease,url,assets
