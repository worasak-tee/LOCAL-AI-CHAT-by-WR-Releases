name: Verify V1.2.0 Release

on:
  push:
    paths:
      - ".github/workflows/verify-v1.2.0.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v1.2.0
    steps:
      - uses: actions/checkout@v4

      - name: Wait for complete public release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-status
          for i in $(seq 1 36); do
            if gh release view "$TAG" --json tagName,isDraft,isPrerelease,url,assets > /tmp/release.json 2>/dev/null; then
              if python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/release.json').read_text())
          assets = {a.get('name'): a for a in data.get('assets', [])}
          expected = {
              'LOCAL-AI-CHAT-by-WR_Portable.exe': 100_000_000,
              'LOCAL-AI-CHAT-by-WR_Update_V1.2.0.zip': 100_000_000,
              'SHA256SUMS.txt': 100,
          }
          ok = (
              data.get('tagName') == 'v1.2.0'
              and data.get('isDraft') is False
              and data.get('isPrerelease') is False
              and set(assets) == set(expected)
              and all(int(assets[name].get('size') or 0) >= minimum for name, minimum in expected.items())
          )
          raise SystemExit(0 if ok else 1)
          PY
              then
                python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          data = json.loads(Path('/tmp/release.json').read_text())
          data['verified'] = True
          data['verified_at'] = datetime.now(timezone.utc).isoformat()
          Path('release-status/v1.2.0.json').write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          PY
                exit 0
              fi
            fi
            echo "Release assets not complete yet ($i/36); waiting..."
            sleep 10
          done
          echo "Timed out waiting for complete v1.2.0 release assets"
          exit 1

      - name: Commit verification marker
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-status/v1.2.0.json
          git commit -m "Verify public release v1.2.0"
          git push
